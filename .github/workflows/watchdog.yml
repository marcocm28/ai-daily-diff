name: Pipeline watchdog
on:
  schedule:
    - cron: "17,37,57 4-21 * * 1-6"
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
concurrency:
  group: pipeline-watchdog
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.33.1
      - name: Recover collection and failed downstream jobs without bypassing gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/pipeline_watch.py --apply --output .local/pipeline-status.json
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-status
          path: .local/pipeline-status.json
          retention-days: 7

name: Render

# Rebuild when inputs OR rendering code change. No shallow git diff.
on:
  pull_request:
    branches: [main]
    paths: ["data/episodes/**", "examples/**", "src/**", "templates/**", "assets/**", "config/**", "tools/mark_ci_verified.py", "requirements*.txt", ".github/workflows/render.yml"]
  push:
    branches: [main]
    paths: ["data/episodes/**", "examples/**", "src/**", "templates/**", "assets/**", "config/**", "tools/mark_ci_verified.py", "requirements*.txt", ".github/workflows/render.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: playwright install --with-deps chromium
      - name: Test the whole archive before any render
        run: python -m pytest tests/ -q
      - name: Verify and render every episode
        run: |
          set -euo pipefail
          shopt -s nullglob
          for episode in data/episodes/*.json; do
            python src/schema.py "$episode" --verify-examples
            # A preview earns its badge on this runner but is never committed.
            python tools/mark_ci_verified.py "$episode"
            python src/render_video.py "$episode"
            python src/render_artifacts.py "$episode"
            python src/thumbnail.py "$episode"
            python src/render_page.py "$episode"
          done
      - name: Preview for human review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: episode-preview-${{ github.event.pull_request.number }}
          path: |
            output/**
            site/**
          retention-days: 14
      - name: Bind publishable episodes to this verified run
        run: python src/publication.py manifest
      - name: Verified release for automatic YouTube publication
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: |
            release.json
            data/episodes/
            output/
          if-no-files-found: error
          retention-days: 14
      - name: Exact tested site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: site/
          if-no-files-found: error
          retention-days: 14

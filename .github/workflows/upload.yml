name: Upload to YouTube

on:
  workflow_run:
    workflows: ["Render"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      render_run_id:
        description: "Successful main Render run ID (required for retry or dry run)"
        required: true
        type: string
      episode_date:
        description: "Optional YYYY-MM-DD; empty checks all eligible episodes in the release"
        required: false
        type: string
      dry_run:
        description: "Inspect release without calling YouTube or writing receipts"
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: youtube-publisher
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check provenance of requested render
        id: render
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.render_run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/render.json"
          python - <<'PY'
          import json, os, pathlib
          r = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'render.json').read_text())
          assert r['conclusion'] == 'success' and r['head_branch'] == 'main'
          assert r['event'] in ('push', 'workflow_dispatch')
          assert r['path'] == '.github/workflows/render.yml'
          assert r['head_repository']['full_name'] == os.environ['REPOSITORY']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"commit={r['head_sha']}\nrun_id={r['id']}\n")
          PY
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: .local/release
          run-id: ${{ steps.render.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish once to the verified dedicated channel
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          RENDER_RUN_ID: ${{ steps.render.outputs.run_id }}
          RENDER_COMMIT: ${{ steps.render.outputs.commit }}
          EPISODE_DATE: ${{ inputs.episode_date }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          args=(publish --release .local/release)
          if [ -n "$EPISODE_DATE" ]; then args+=(--date "$EPISODE_DATE"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python src/publication.py "${args[@]}"

name: Reconcile YouTube publications
on:
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Release an existing scheduled video immediately"
        required: false
        default: false
        type: boolean
      episode_id:
        description: "Exact scheduled episode ID; required when publish_now is true"
        required: false
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: youtube-publisher
  cancel-in-progress: false
  queue: max
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Publish one verified scheduled video immediately
        if: inputs.publish_now == true
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          EPISODE_ID: ${{ inputs.episode_id }}
        run: python src/publication.py release --episode "$EPISODE_ID"
      - name: Check actual visibility without uploading or changing videos
        if: inputs.publish_now != true
        id: receipts
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python src/publication.py reconcile
      - name: Route newly public videos to their approved playlist
        if: >-
          (inputs.publish_now == true && success()) ||
          steps.receipts.outputs.new_publications == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run channel-sync.yml --ref main

name: Reconcile YouTube publications
on:
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: youtube-publisher
  cancel-in-progress: false
  queue: max
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check actual visibility without uploading or changing videos
        id: receipts
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python src/publication.py reconcile
      - name: Route newly public videos to their approved playlist
        if: steps.receipts.outputs.new_publications == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run channel-sync.yml --ref main
